# Publishes the School Admin and School Teacher apps as free websites on GitHub Pages:
#   https://<owner>.github.io/<repo>/admin/     https://<owner>.github.io/<repo>/teacher/
# A second home for the apps, in case a mobile network blocks the Render addresses.
#
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish apps to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'client/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm install --no-audit --no-fund

      - name: Build the Admin and Teacher apps
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          VITE_APP_MODE=admin   npx vite build --base="/${REPO}/admin/"   --outDir ../site/admin   --emptyOutDir
          VITE_APP_MODE=teacher npx vite build --base="/${REPO}/teacher/" --outDir ../site/teacher --emptyOutDir
          cp pages-site/index.html ../site/index.html
          cp pages-site/404.html ../site/404.html
          touch ../site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
